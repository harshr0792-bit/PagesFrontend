<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

  <!-- Sign Up Card -->
  <div class="bg-white shadow-lg rounded-xl p-8 w-[90%] max-w-md border border-gray-200">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
      Sign Up
    </h2>

    <!-- Full Name -->
    <div class="mb-4">
      <label for="name" class="block text-gray-700 mb-2">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white text-gray-800">
    </div>

    <!-- Email -->
    <div class="mb-4">
      <label for="email" class="block text-gray-700 mb-2">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white text-gray-800">
    </div>

    <!-- Password -->
    <div class="mb-4">
      <label for="password" class="block text-gray-700 mb-2">Password</label>
      <input type="password" id="password" placeholder="Enter your password"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white text-gray-800">
    </div>

    <!-- Phone Number -->
    <div class="mb-4">
      <label for="phone" class="block text-gray-700 mb-2">Phone Number</label>
      <input type="text" id="phone" placeholder="Enter your phone number"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white text-gray-800">
    </div>

    <!-- Address -->
    <div class="mb-6">
      <label for="address" class="block text-gray-700 mb-2">Address</label>
      <textarea id="address" rows="3" placeholder="Enter your address"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white text-gray-800"></textarea>
    </div>

    <!-- Create Account Button -->
    <button
      class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500
             text-white font-semibold transition-all duration-300 transform hover:scale-105 hover:shadow-lg">
      Create Account
    </button>

    <!-- Login Link -->
    <p class="text-center text-gray-600 mt-4 text-sm">
      Already have an account?
      <a href="#" class="text-blue-500 font-medium hover:underline">Login here</a>
    </p>
  </div>

</body>
</html>
