<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

  <!-- Login Card -->
  <div class="bg-white shadow-lg rounded-xl p-8 w-[90%] max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-700 mb-2">Sign in to start your session</h2>

    <h3 class="text-lg font-semibold text-center text-gray-600 mb-6">User</h3>

    <!-- Email Input -->
    <div class="mb-4">
      <label for="email" class="block text-gray-600 mb-2">Email</label>
      <input type="email" id="email" placeholder="Enter your email"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Password Input -->
    <div class="mb-6">
      <label for="password" class="block text-gray-600 mb-2">Password</label>
      <input type="password" id="password" placeholder="Enter your password"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Login Button -->
    <button
      class="w-full py-3 rounded-lg bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 
             text-white font-semibold transition-all duration-300 transform hover:scale-105 hover:shadow-lg">
      Log In
    </button>

    <!-- Sign Up Link -->
    <p class="text-center text-gray-600 mt-4 text-sm">
      Don't have an account?
      <a href="#" class="text-blue-600 font-medium hover:underline">Sign Up</a>
    </p>
  </div>

</body>
</html>
