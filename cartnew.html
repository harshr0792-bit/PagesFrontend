<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    .cart-card:hover {
      box-shadow: 0px 8px 20px rgba(0,0,0,0.1);
      transform: translateY(-2px);
      transition: all 0.3s ease;
    }
    .btn-purple {
      background: #6d28d9;
      color: #fff;
      font-weight: 600;
    }
    .btn-purple:hover {
      background: #5b21b6;
      color: #fff;
    }
    /* Custom hover effect for + / - buttons */
    .qty-btn:hover, .qty-btn:focus, .qty-btn:active {
      background-color: #6d28d9 !important;
      border-color: #6d28d9 !important;
      color: #fff !important;
      box-shadow: none !important;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .cart-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .cart-card .flex.items-center.gap-4 {
        flex-direction: row;
        width: 100%;
      }
      .cart-card .input-group {
        width: 100% !important;
      }
      .cart-card .input-group input {
        flex: 1;
      }
    }

    @media (max-width: 576px) {
      .cart-card {
        padding: 1rem;
      }
      .cart-card img, .cart-card .w-20.h-20 {
        width: 60px;
        height: 60px;
      }
      h3 {
        font-size: 1.25rem;
      }
      .btn-purple {
        font-size: 0.9rem;
        padding: 0.6rem;
      }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans">

  <div class="container py-5">
    <!-- Back link -->
    <a href="#" class="text-gray-600 flex items-center gap-2 mb-4 hover:text-purple-600">
      <i class="fa fa-arrow-left"></i> Continue Shopping
    </a>

    <div class="row g-4">
      <!-- Left Side - Cart Items -->
      <div class="col-lg-8 col-md-7 col-sm-12">
        <h3 class="text-2xl font-bold mb-4 flex items-center gap-2">
          <i class="fa fa-shopping-basket text-purple-600"></i> Shopping Cart (2 items)
        </h3>

        <!-- Item 1 -->
        <div class="cart-card bg-white p-4 rounded-xl mb-4 flex items-center justify-between shadow-sm">
          <div class="flex items-center gap-4 w-full">
            <div class="w-20 h-20 bg-gray-100 rounded-md flex items-center justify-center text-gray-400">
              <i class="fa fa-image text-2xl"></i>
            </div>
            <div class="flex-1">
              <h5 class="font-semibold">Custom T-Shirt</h5>
              <p class="text-sm text-gray-500">Size: L</p>
              <p class="text-sm text-gray-500">Color: Black</p>
              <p class="text-purple-700 font-bold mt-2">$24.99</p>
            </div>
          </div>
          <div class="flex items-center gap-4 mt-3 mt-md-0">
            <div class="input-group w-auto">
              <button class="btn btn-outline-secondary px-3 qty-btn">-</button>
              <input type="text" class="form-control text-center w-12" value="2">
              <button class="btn btn-outline-secondary px-3 qty-btn">+</button>
            </div>
            <button class="text-red-500 hover:text-red-700">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="cart-card bg-white p-4 rounded-xl mb-4 flex items-center justify-between shadow-sm">
          <div class="flex items-center gap-4 w-full">
            <div class="w-20 h-20 bg-gray-100 rounded-md flex items-center justify-center text-gray-400">
              <i class="fa fa-image text-2xl"></i>
            </div>
            <div class="flex-1">
              <h5 class="font-semibold">Photo Mug</h5>
              <p class="text-sm text-gray-500">Size: Standard</p>
              <p class="text-sm text-gray-500">Color: White</p>
              <p class="text-purple-700 font-bold mt-2">$15.99</p>
            </div>
          </div>
          <div class="flex items-center gap-4 mt-3 mt-md-0">
            <div class="input-group w-auto">
              <button class="btn btn-outline-secondary px-3 qty-btn">-</button>
              <input type="text" class="form-control text-center w-12" value="1">
              <button class="btn btn-outline-secondary px-3 qty-btn">+</button>
            </div>
            <button class="text-red-500 hover:text-red-700">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Right Side - Order Summary -->
      <div class="col-lg-4 col-md-5 col-sm-12">
        <div class="bg-white p-4 rounded-xl shadow-md">
          <h4 class="font-bold text-lg mb-3">Order Summary</h4>
          <div class="flex justify-between text-gray-600 mb-2">
            <span>Subtotal</span>
            <span>$65.97</span>
          </div>
          <div class="flex justify-between text-gray-600 mb-2">
            <span>Shipping</span>
            <span>$5.99</span>
          </div>
          <div class="flex justify-between text-gray-600 mb-2">
            <span>Tax</span>
            <span>$5.28</span>
          </div>
          <hr class="my-3">
          <div class="flex justify-between font-bold text-lg">
            <span>Total</span>
            <span class="text-purple-700">$77.24</span>
          </div>

          <button class="btn w-100 mt-4 btn-purple rounded-xl py-2">Proceed to Checkout</button>

          <!-- New Address Text Box with Pre-filled Address -->
          <label for="address" class="block mt-4 mb-2 font-semibold text-gray-700">
            Delivery Address
          </label>
          <textarea id="address" rows="3" class="form-control rounded-lg border border-gray-300 p-2 focus:ring-2 focus:ring-purple-500 focus:outline-none w-100">123 Main Street, Green Park, New Delhi, India - 110016</textarea>

          <button class="btn w-100 mt-3 btn-purple rounded-xl py-2">Edit your Address</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
