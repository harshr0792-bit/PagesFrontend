<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Address</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .form-container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      padding: 30px;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-control, textarea {
      border-radius: 8px;
      border: 1px solid #ddd;
      padding: 10px;
    }
    .btn-primary {
      background-color: #7c3aed !important;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: background 0.3s;
    }
    .btn-primary:hover {
      background-color: #6d28d9 !important;
    }
    /* Custom Red Cancel Button */
    .btn-cancel {
      background-color: #ef4444; /* Tailwind red-500 */
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      transition: background 0.3s;
    }
    .btn-cancel:hover {
      background-color: #dc2626; /* Tailwind red-600 */
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2 class="title text-center text-purple-700">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 2C8.13 2 5 5.13 5 9c0 7 7 13 7 13s7-6 7-13c0-3.87-3.13-7-7-7z"/>
        <circle cx="12" cy="9" r="2.5"/>
      </svg>
      Delivery Address
    </h2>

    <form id="addressForm" class="mt-4 space-y-4">
      <div>
        <label class="block font-semibold mb-1">Full Name *</label>
        <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
      </div>

      <div>
        <label class="block font-semibold mb-1">Email Address *</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email address" required>
      </div>

      <div>
        <label class="block font-semibold mb-1">Phone Number *</label>
        <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" pattern="[0-9]{10}" required>
      </div>

      <div>
        <label class="block font-semibold mb-1">Delivery Address *</label>
        <textarea id="address" class="form-control" rows="3" placeholder="Enter your complete delivery address including street, city, state, and postal code" required></textarea>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-4">
        <button type="submit" class="btn btn-primary w-full sm:w-1/2">Save Address & Continue</button>
        <button type="button" class="btn btn-cancel w-full sm:w-1/2" onclick="clearForm()">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('addressForm');
    const nameField = document.getElementById('fullName');
    const emailField = document.getElementById('email');
    const phoneField = document.getElementById('phone');
    const addressField = document.getElementById('address');

    // Load saved data from localStorage on page load
    window.onload = () => {
      if (localStorage.getItem('deliveryData')) {
        const savedData = JSON.parse(localStorage.getItem('deliveryData'));
        nameField.value = savedData.name || '';
        emailField.value = savedData.email || '';
        phoneField.value = savedData.phone || '';
        addressField.value = savedData.address || '';
      }
    };

    // Save to localStorage on input change
    [nameField, emailField, phoneField, addressField].forEach(input => {
      input.addEventListener('input', () => {
        const data = {
          name: nameField.value,
          email: emailField.value,
          phone: phoneField.value,
          address: addressField.value
        };
        localStorage.setItem('deliveryData', JSON.stringify(data));
      });
    });

    // Handle form submission
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = nameField.value.trim();
      const email = emailField.value.trim();
      const phone = phoneField.value.trim();
      const address = addressField.value.trim();

      if (!name || !email || !phone || !address) {
        alert("Please fill out all fields.");
        return;
      }

      if (!/^[0-9]{10}$/.test(phone)) {
        alert("Please enter a valid 10-digit phone number.");
        return;
      }

      alert("Address saved successfully!");
      localStorage.removeItem('deliveryData');
      form.reset();
    });

    // Clear form and localStorage on Cancel
    function clearForm() {
      form.reset();
      localStorage.removeItem('deliveryData');
    }
  </script>

</body>
</html>
