<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 25px;
    }

    .order-card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .order-status {
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .order-status span {
      font-weight: bold;
      color: #16a34a; /* Green */
    }

    .delivery-date {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .product-info {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 15px;
      background: #f8fafc;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .product-info img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      background: #f3f3f3;
    }

    .product-details {
      flex: 1;
    }

    .product-details h3 {
      margin: 0 0 5px;
      font-size: 1rem;
      font-weight: bold;
    }

    .product-details p {
      margin: 3px 0;
      font-size: 0.9rem;
      color: #374151;
    }

    .exchange {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 8px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .product-info {
        flex-direction: column;
        align-items: flex-start;
      }

      .product-info img {
        width: 100%;
        height: auto;
        max-width: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Orders</h1>

    <!-- Order Card 1 -->
    <div class="order-card">
      <div class="order-status">
        <span>Delivered</span>
        <span class="delivery-date">On Tue, 8 Apr</span>
      </div>
      <div class="product-info">
        <img src="https://via.placeholder.com/80x80.png?text=Product" alt="Product">
        <div class="product-details">
          <h3>Minimalist</h3>
          <p>10% Niacinamide Face Serum with Zinc - 30 ml</p>
          <p>Size: 20-30 ML</p>
        </div>
      </div>
      <p class="exchange">Exchange/Return window closed on Tue, 22 Apr</p>
    </div>

    <!-- Order Card 2 -->
    <div class="order-card">
      <div class="order-status">
        <span>Delivered</span>
        <span class="delivery-date">On Sat, 22 Feb 2025</span>
      </div>
      <div class="product-info">
        <img src="https://via.placeholder.com/80x80.png?text=Product" alt="Product">
        <div class="product-details">
          <h3>Mamaearth</h3>
          <p>Onion Shampoo - 600 ml</p>
          <p>Size: 500-600 ML</p>
        </div>
      </div>
      <p class="exchange">Exchange/Return window closed on Sat, 8 Mar 2025</p>
    </div>
  </div>
</body>
</html>
